# À adapter : nom DNS et certificats. Pas de buffering pour les flux SSE.
server {
    listen 443 ssl;
    server_name ia.providence.example;
    ssl_certificate /etc/letsencrypt/live/ia.providence.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ia.providence.example/privkey.pem;
    client_max_body_size 16m;

    # Les requêtes peuvent contenir des identifiants dans leurs paramètres.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
